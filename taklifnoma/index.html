<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c0010">
<title>To'y taklifnomasi</title>
<meta name="description" content="Nikoh to'yimizga taklifnoma">
<meta property="og:title" content="To'y taklifnomasi">
<meta property="og:description" content="Yaltiroqni puflang — taklifnoma uning ostida yashiringan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --velvet-1:#3d0007; --velvet-2:#7a0012; --velvet-3:#b8001f; --velvet-4:#e3132f;
  --ink:#0b0204; --ink-2:#16050a; --ink-3:#22080f;
  --cream:#f7ece4; --cream-dim:rgba(247,236,228,.72); --cream-faint:rgba(247,236,228,.42);
  --gold:#e8c9a0; --line:rgba(232,201,160,.22);
  --script:'Great Vibes',cursive; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--serif);font-size:18px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100dvh;touch-action:none}
a{color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--velvet-3);color:#fff}

/* ============ 1. YALTIROQ (glitter) ============ */
#glitter{position:fixed;inset:0;z-index:50;overflow:hidden;transition:opacity 1.6s ease;touch-action:none;cursor:pointer}
#glitter canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glitter.gone{opacity:0;pointer-events:none}
.g-text{position:absolute;left:0;right:0;padding:0 20px;text-align:center;pointer-events:none;transition:opacity .6s ease;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.g-text::before{content:"";position:absolute;inset:-30px 6%;z-index:-1;background:radial-gradient(closest-side,rgba(30,0,6,.55),transparent);filter:blur(8px)}
.g-top{top:max(14vh,72px)}
.g-top p{font-style:italic;font-size:clamp(17px,4.6vw,22px);color:var(--cream)}
.g-top small{display:block;margin-top:10px;font-family:var(--sans);font-size:11px;letter-spacing:.5em;color:var(--cream-dim)}
.g-bottom{bottom:max(12vh,64px)}
.g-bottom h2{font-family:var(--script);font-weight:400;font-size:clamp(40px,11vw,58px);line-height:1.1;display:inline-block;color:#fff;animation:breathe 2.8s ease-in-out infinite}
.g-bottom p{font-style:italic;font-size:15px;color:var(--cream-dim);margin-top:4px}
.g-mic{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream-faint);opacity:0;transition:opacity .5s}
.g-mic.on{opacity:1}
.g-mic i{width:6px;height:6px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:pulse 1.4s infinite}
#glitter.blowing .g-text{opacity:0}
@keyframes breathe{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes pulse{50%{opacity:.25}}

/* ============ 2. SAHNA + PARDA ============ */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;overflow:clip;contain:paint;isolation:isolate;
  background:radial-gradient(70% 45% at 55% 78%,#4a0d16 0%,transparent 70%),radial-gradient(120% 70% at 50% 100%,#2a050c 0%,#12030a 55%,#070103 100%)}
.hero>*{position:absolute}
.beam{inset:0;width:100%;height:100%;z-index:1;opacity:0;transition:opacity 2.4s ease 1.4s;pointer-events:none;mix-blend-mode:screen}
.beam.soft{filter:blur(14px)}
.open .beam{opacity:1}
.smoke{z-index:1;left:-25%;right:-25%;bottom:4%;height:55%;pointer-events:none;opacity:0;transition:opacity 3s ease 1.6s;
  background:radial-gradient(35% 40% at 22% 45%,rgba(120,35,48,.55),transparent 70%),radial-gradient(30% 35% at 78% 60%,rgba(110,25,40,.4),transparent 70%),radial-gradient(50% 30% at 50% 92%,rgba(255,160,150,.14),transparent 70%);
  filter:blur(22px);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(7%) scale(1.1)}}
.open .smoke{opacity:1}
.ledge{z-index:2;left:-12%;right:-12%;bottom:-3%;height:15%;border-radius:50% 50% 0 0/45% 45% 0 0;
  background:linear-gradient(180deg,#3a1a1d,#140709 40%,#060203);box-shadow:inset 0 1px 0 rgba(255,205,195,.28),0 -14px 40px rgba(255,120,120,.08)}
.halo{z-index:2;left:50%;bottom:9%;width:min(110vw,560px);height:58svh;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,200,190,.22),rgba(255,120,120,.06) 60%,transparent)}
.stage{z-index:3;left:50%;bottom:calc(4% + 6px);width:min(64vw,37svh,300px);aspect-ratio:240/320;transform:translateX(-50%)}
.stage>*{position:absolute}
.pool{left:-22%;right:-22%;bottom:-5%;height:24%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,210,.65),rgba(255,140,140,.22) 55%,transparent);animation:pool 5s ease-in-out infinite}
@keyframes pool{50%{opacity:.75;transform:scaleX(.96)}}
.ring{left:-9%;right:-9%;bottom:0;height:12.5%;border-radius:50%;border:2px solid rgba(255,232,222,.9);
  box-shadow:0 0 14px 2px rgba(255,140,140,.85),inset 0 0 12px rgba(255,150,150,.7);animation:ringGlow 3s ease-in-out infinite}
.ring.back{clip-path:inset(0 0 50% 0)}
.ring.front{clip-path:inset(50% 0 0 0);z-index:2}
@keyframes ringGlow{50%{box-shadow:0 0 22px 4px rgba(255,140,140,1),inset 0 0 16px rgba(255,150,150,.9)}}
.couple-box{inset:0;z-index:1}
.couple-box svg{width:100%;height:100%;overflow:visible}
.couple-box video,.couple-box img{width:140%;height:100%;margin-left:-20%;object-fit:cover;
  -webkit-mask:radial-gradient(60% 55% at 50% 55%,#000 55%,transparent);mask:radial-gradient(60% 55% at 50% 55%,#000 55%,transparent)}
/* raqs */
.dance{transform-box:fill-box;transform-origin:50% 100%;animation:waltz 5.2s ease-in-out infinite}
.skirt{transform-box:fill-box;transform-origin:50% 0;animation:swish 5.2s ease-in-out infinite}
.veil{transform-box:fill-box;transform-origin:80% 0;animation:veil 5.2s ease-in-out infinite}
.couple-sway{transform-box:fill-box;transform-origin:50% 100%;animation:lean 5.2s ease-in-out infinite}
@keyframes waltz{
  0%{transform:translate(0,0) scale(1)}
  25%{transform:translate(14px,-3px) scale(.97)}
  50%{transform:translate(0,0) scale(1)}
  75%{transform:translate(-14px,-2px) scale(1.03)}
  100%{transform:translate(0,0) scale(1)}}
@keyframes lean{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@keyframes swish{0%,50%,100%{transform:skewX(0) scaleX(1)}20%{transform:skewX(-9deg) scaleX(1.05)}70%{transform:skewX(9deg) scaleX(1.05)}}
@keyframes veil{0%,50%,100%{transform:rotate(0)}30%{transform:rotate(7deg)}80%{transform:rotate(-5deg)}}
#dust{inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#curtainCv{inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.vignette{inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,rgba(5,0,2,.75),transparent 16%,transparent 80%,rgba(5,0,2,.5))}

.hero-inner{z-index:6;top:0;left:0;right:0;padding:max(6svh,30px) 20px 0;text-align:center}
.reveal-seq>*{opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity 1.3s ease,transform 1.3s ease,filter 1.3s ease}
.open .reveal-seq>*{opacity:1;transform:none;filter:none}
.open .reveal-seq>*:nth-child(1){transition-delay:.3s}
.open .reveal-seq>*:nth-child(2){transition-delay:1.2s}
.open .reveal-seq>*:nth-child(3){transition-delay:1.7s}
.open .reveal-seq>*:nth-child(4){transition-delay:2.1s}
.open .reveal-seq>*:nth-child(5){transition-delay:2.8s}
.open .reveal-seq>*:nth-child(6){transition-delay:3.2s}
.open .reveal-seq>*:nth-child(7){transition-delay:3.6s}
.kicker{font-style:italic;font-size:clamp(15px,4vw,19px);color:var(--cream-dim)}
.name{font-family:var(--script);font-weight:400;font-size:clamp(50px,14.5vw,96px);line-height:1;color:#fff;
  text-shadow:0 0 22px rgba(255,190,190,.35),0 0 2px rgba(255,255,255,.6)}
.amp{font-family:var(--script);font-size:clamp(26px,7vw,40px);color:var(--gold);line-height:1;margin:0}
.invite-line{font-style:italic;font-size:clamp(15px,4vw,19px);margin-top:10px;color:var(--cream-dim)}
.date-big{font-family:var(--serif);font-weight:500;letter-spacing:.38em;font-size:clamp(18px,5vw,26px);margin-top:6px;padding-left:.38em}
.venue{font-style:italic;font-size:clamp(14px,3.8vw,17px);color:var(--cream-dim)}
.scroll-cue{z-index:6;left:50%;bottom:2px;transform:translateX(-50%);opacity:0;transition:opacity 1.2s ease 4.4s;font-family:var(--sans);font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--cream-faint);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.open .scroll-cue{opacity:1}
.scroll-cue i{width:1px;height:22px;background:linear-gradient(var(--cream-faint),transparent);animation:cue 2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* ============ 3. BO'LIMLAR ============ */
main{position:relative;z-index:2}
section{padding:clamp(72px,12vh,120px) 24px;text-align:center;position:relative}
.wrap{max-width:640px;margin:0 auto}
section+section::before{content:"";position:absolute;top:0;left:50%;width:1px;height:48px;transform:translateX(-50%);background:linear-gradient(var(--line),transparent)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);padding-left:.42em}
.h{font-family:var(--script);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1.1;margin:8px 0 18px;color:#fff}
.lead{font-size:clamp(18px,4.6vw,21px);color:var(--cream-dim);font-style:italic}
.fx{opacity:0;transform:translateY(26px);transition:opacity 1.1s ease,transform 1.1s ease}
.fx.in{opacity:1;transform:none}

.letter{background:linear-gradient(180deg,var(--ink),var(--ink-2))}
.letter .lead{max-width:520px;margin:0 auto}
.sign{font-family:var(--script);font-size:34px;color:var(--gold);margin-top:22px}

/* countdown */
.count{background:radial-gradient(80% 60% at 50% 0%,rgba(184,0,31,.22),transparent 70%),var(--ink-2)}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:26px auto 0}
.timer div{padding:18px 4px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);backdrop-filter:blur(4px)}
.timer b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(30px,8.5vw,44px);line-height:1;font-variant-numeric:lining-nums tabular-nums;color:#fff}
.timer span{display:block;margin-top:8px;font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream-faint)}
.cal-btn{margin-top:28px}

/* program */
.program{background:var(--ink-2)}
.tl{list-style:none;max-width:440px;margin:30px auto 0;text-align:left;position:relative}
.tl::before{content:"";position:absolute;left:78px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl li{display:grid;grid-template-columns:70px 1fr;gap:24px;padding:14px 0;position:relative}
.tl li::before{content:"";position:absolute;left:74px;top:24px;width:9px;height:9px;border-radius:50%;background:var(--velvet-4);box-shadow:0 0 0 4px rgba(227,19,47,.18),0 0 14px var(--velvet-4)}
.tl time{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--gold);text-align:right;padding-top:2px}
.tl h3{font-weight:500;font-size:21px;line-height:1.3;color:#fff}
.tl p{font-size:16px;color:var(--cream-faint);font-style:italic}

/* location */
.place{background:linear-gradient(180deg,var(--ink-2),var(--ink-3))}
.venue-name{font-size:clamp(24px,6.4vw,30px);font-weight:500;color:#fff}
.addr{color:var(--cream-dim);font-style:italic;margin-top:4px}
.map{margin:28px auto 0;max-width:560px;border-radius:18px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:#1a0509;
  filter:grayscale(.6) sepia(.35) hue-rotate(-30deg) saturate(1.4) brightness(.8)}
.map iframe{width:100%;height:100%;border:0;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 28px;border-radius:999px;border:1px solid var(--gold);
  font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:transparent;text-decoration:none;cursor:pointer;
  transition:background .3s,color .3s,transform .2s}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(135deg,var(--velvet-4),var(--velvet-2));border-color:transparent;color:#fff;box-shadow:0 10px 30px -10px rgba(227,19,47,.7)}
.btn.solid:hover{filter:brightness(1.1);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}

/* dress code */
.dress{background:var(--ink-3)}
.swatches{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.swatches i{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.5)}

/* rsvp */
.rsvp{background:radial-gradient(90% 70% at 50% 100%,rgba(184,0,31,.28),transparent 70%),var(--ink-3)}
form{max-width:440px;margin:30px auto 0;text-align:left;display:grid;gap:16px}
label{display:grid;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-faint)}
input,select,textarea{font:inherit;font-family:var(--serif);font-size:18px;letter-spacing:0;text-transform:none;color:var(--cream);background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .25s,background .25s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(255,255,255,.06)}
select option{background:var(--ink-2)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{position:relative}
.choice input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.choice span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:12px;font-family:var(--serif);font-size:17px;letter-spacing:0;text-transform:none;color:var(--cream-dim);cursor:pointer;transition:all .25s;text-align:center;padding:6px}
.choice input:checked+span{border-color:var(--gold);color:#fff;background:rgba(232,201,160,.1)}
.choice input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
form .btn{width:100%;margin-top:6px}
.thanks{display:none;margin-top:26px}
.thanks.show{display:block;animation:fadeUp .8s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}

footer{padding:70px 24px 90px;text-align:center;background:var(--ink)}
footer .name{font-size:clamp(46px,13vw,72px)}
footer p{font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--cream-faint);margin-top:14px;text-transform:uppercase}

/* musiqa */
#music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:rgba(20,4,8,.7);backdrop-filter:blur(8px);color:var(--cream);display:none;place-items:center;cursor:pointer}
#music.show{display:grid}
#music svg{width:18px;height:18px}
#music.playing svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.4s!important;transition-delay:0s!important}
}
</style>
</head>
<body class="locked">

<!-- 1. Yaltiroq qatlam -->
<div id="glitter" role="button" tabindex="0" aria-label="Taklifnomani ochish uchun bosing">
  <canvas></canvas>
  <div class="g-text g-top">
    <p data-t="glitterTitle"></p>
    <small data-t="initials"></small>
  </div>
  <div class="g-text g-bottom">
    <h2 data-t="glitterCta"></h2>
    <p data-t="glitterHint"></p>
    <span class="g-mic" id="micHint"><i></i><span data-t="micOn"></span></span>
  </div>
</div>

<!-- 2. Sahna (parda canvas ichida chiziladi) -->
<header class="hero" id="hero">
  <svg class="beam soft" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="bm" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffe9e0" stop-opacity=".42"/><stop offset=".7" stop-color="#ffd2c6" stop-opacity=".16"/><stop offset="1" stop-color="#ffc0b4" stop-opacity=".06"/></linearGradient></defs>
    <polygon points="14,-2 31,-2 92,96 50,96" fill="url(#bm)"/>
  </svg>
  <svg class="beam" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".25" stop-color="#fff2ec" stop-opacity=".75"/><stop offset="1" stop-color="#ffd8cc" stop-opacity=".15"/></linearGradient></defs>
    <line x1="14" y1="-2" x2="50" y2="96" stroke="url(#bl)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <line x1="31" y1="-2" x2="92" y2="96" stroke="url(#bl)" stroke-width="1" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="smoke"></div>
  <div class="halo"></div>
  <div class="ledge"></div>
  <div class="stage">
    <div class="pool"></div>
    <div class="ring back"></div>
    <div class="couple-box" id="coupleBox">
      <svg viewBox="0 0 240 320" aria-label="Raqs tushayotgan kelin va kuyov" role="img">
        <defs>
          <radialGradient id="gown" cx="42%" cy="8%" r="105%">
            <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#fdeeea"/>
            <stop offset=".72" stop-color="#f0bcb8"/><stop offset="1" stop-color="#b9606b"/></radialGradient>
          <linearGradient id="bodice" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1c9c4"/></linearGradient>
          <linearGradient id="suit" x1="0" x2="1"><stop offset="0" stop-color="#3a1d22"/><stop offset=".45" stop-color="#140a0c"/><stop offset="1" stop-color="#050203"/></linearGradient>
          <linearGradient id="skinB" x1="0" x2="1"><stop offset="0" stop-color="#f3cdc2"/><stop offset=".6" stop-color="#a86e66"/><stop offset="1" stop-color="#5a3532"/></linearGradient>
          <linearGradient id="skinG" x1="0" x2="1"><stop offset="0" stop-color="#9a6058"/><stop offset=".5" stop-color="#4a2a27"/><stop offset="1" stop-color="#1c0e0d"/></linearGradient>
          <linearGradient id="veilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="soft"><feGaussianBlur stdDeviation=".5"/></filter>
        </defs>
        <g class="dance">
          <g class="couple-sway" filter="url(#soft)">
            <!-- kuyov -->
            <path fill="#0a0506" d="M134 156 L131 298 L143 298 L146 204 L150 298 L162 298 L160 156 Z"/>
            <path fill="url(#suit)" d="M124 88 C131 80 151 79 160 87 C164 110 165 138 163 162 C152 168 136 168 128 162 C125 138 123 110 124 88 Z"/>
            <path fill="#efe3df" d="M137 85 L143 106 L149 85 Z" opacity=".75"/><path d="M125 92 C126 86 130 82 136 81" stroke="#ffd9cf" stroke-opacity=".7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path fill="#0a0506" d="M141 92 l-3 3 l3 3 l3 -3 Z"/>
            <rect x="138" y="70" width="9" height="15" rx="3" fill="url(#skinG)"/>
            <path fill="url(#skinG)" d="M152 54 C153 64 152 72 147 75 C142 77 137 75 135 71 L134 67 L131.5 65.5 L133.5 63 L132 58 C134 50 150 46 152 54 Z"/>
            <path fill="#120808" d="M132 57 C131 46 152 42 155 54 C155 60 153 66 151 68 C150 62 149 57 146 55 C141 53 136 55 132 57 Z"/>

<script>
(() => {
"use strict";
const C = CONFIG, T = C.text;
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- matnlarni joylash ---------- */
const vals = {...T, groom:C.groom, bride:C.bride, monogram:C.monogram, initials:C.initials, dateText:C.dateText,
  venue:C.venue, city:C.city, address:C.address, rsvpText:T.rsvpText.replace('{deadline}', C.rsvpDeadline)};
document.querySelectorAll('[data-t]').forEach(el => { const v = vals[el.dataset.t]; if (v != null) el.textContent = v; });
document.title = `${C.groom} & ${C.bride} — to'y taklifnomasi`;

if (C.coupleVideo) $('#coupleBox').innerHTML = `<video src="${C.coupleVideo}" autoplay muted loop playsinline></video>`;
else if (C.photo) $('#coupleBox').innerHTML = `<img src="${C.photo}" alt="${C.groom} va ${C.bride}">`;
$('#tl').innerHTML = C.program.map(([t, h, p]) => `<li><time>${t}</time><div><h3>${h}</h3><p>${p}</p></div></li>`).join('');
$('#swatches').innerHTML = C.dressColors.map(c => `<i style="background:${c}"></i>`).join('');
$('#mapFrame').src = `https://maps.google.com/maps?q=${C.lat},${C.lng}&z=16&output=embed`;
$('#mapLink').href = `https://www.google.com/maps/search/?api=1&query=${C.lat},${C.lng}`;
$('#yandexLink').href = `https://yandex.uz/maps/?pt=${C.lng},${C.lat}&z=16&l=map`;

/* =====================================================================
   1. YALTIROQ — canvas zarrachalari (puflanganda qum kabi pastga to'kiladi)
   ===================================================================== */
const gWrap = $('#glitter'), gCv = gWrap.querySelector('canvas'), g = gCv.getContext('2d');
let W, H, DPR, parts = [], state = 'idle', cleared = 0, raf, blowT = 0, lastT = 0;
const REDS = ['#ff1f3a','#e0102b','#b5001e','#8c0016','#ff4a5f','#c80a26','#6d0011'];
const GRAV = .42;                       // px / kadr²

function sizeGlitter() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  gCv.width = W * DPR; gCv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const n = Math.min(Math.round(W * H / 20), 18000);
  parts = Array.from({length: n}, () => {
    const spark = Math.random() < .07;
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: spark ? 0.8 + Math.random() * 1.4 : 0.6 + Math.random() * 1.5,
      c: spark ? '#fff4f0' : REDS[(Math.random() * REDS.length) | 0],
      spark, ph: Math.random() * 6.28, sp: .6 + Math.random() * 2.2,
      vx: 0, vy: 0, a: 1, fly: false, rest: false,
      floor: H - 2 - Math.random() * Math.random() * 30
    };
  }).sort((a, b) => (a.c < b.c ? -1 : a.c > b.c ? 1 : 0));
  cleared = 0;
}

function drawGlitter(t) {
  const dt = Math.min(3, lastT ? (t - lastT) / 16.67 : 1); lastT = t;
  g.clearRect(0, 0, W, H);
  // fon: yaltiroq qatlami — puflanganda u ham pastga sirg'alib tushadi
  const el = state === 'blown' ? (t - blowT) / 16.67 : 0;
  const top = .5 * GRAV * el * el;
  if (top < H) {
    const bg = g.createRadialGradient(W * .5, H * .4, 0, W * .5, H * .5, Math.max(W, H) * .8);
    bg.addColorStop(0, '#5a0612'); bg.addColorStop(.6, '#2a0208'); bg.addColorStop(1, '#120004');
    g.fillStyle = bg; g.fillRect(0, top, W, H - top);
    if (top > 0) {
      const e = g.createLinearGradient(0, top - 60, 0, top);
      e.addColorStop(0, 'rgba(42,2,8,0)'); e.addColorStop(1, 'rgba(42,2,8,.95)');
      g.fillStyle = e; g.fillRect(0, top - 60, W, 60);
    }
  }
  const fading = state === 'blown' && t - blowT > 1500;
  let alive = 0;
  for (const p of parts) {
    if (p.a <= 0) continue;
    if (p.fly && !p.rest) {
      p.vy += GRAV * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985;
      if (p.y >= p.floor) {
        p.y = p.floor;
        if (p.vy > 4) { p.vy *= -.16; p.vx = p.vx * .4 + (Math.random() - .5) * 1.4; }
        else { p.rest = true; p.vy = 0; }
      }
      if (p.x < -10 || p.x > W + 10) p.a = 0;
    }
    if (fading) p.a -= .022 * dt * (p.rest ? 1 : .6);
    if (p.a <= 0) continue;
    alive++;
    const tw = .45 + .55 * Math.abs(Math.sin(p.ph + t * .0012 * p.sp));
    g.globalAlpha = p.a * (p.spark ? tw : .55 + .45 * tw);
    if (g.fillStyle !== p.c) g.fillStyle = p.c;
    if (p.spark && tw > .85 && !p.fly) {
      const s = p.r * 3.2 * tw;
      g.fillRect(p.x - s, p.y - .35, s * 2, .7);
      g.fillRect(p.x - .35, p.y - s, .7, s * 2);
    }
    const streak = p.fly && !p.rest ? Math.min(5, Math.abs(p.vy) * .35) : 0;
    g.fillRect(p.x - p.r, p.y - p.r - streak, p.r * 2, p.r * 2 + streak);
  }
  g.globalAlpha = 1;
  return alive;
}

function loop(t) {
  const alive = drawGlitter(t);
  if (state === 'blown' && alive === 0 && t - blowT > 1500) { finishGlitter(); return; }
  raf = requestAnimationFrame(loop);
}

/* barmoq bilan yaltiroqni surish — surilgan zarrachalar ham pastga to'kiladi */
function wipe(x, y, dx, dy) {
  const R = 44, R2 = R * R;
  for (const p of parts) {
    if (p.fly || p.a <= 0) continue;
    const ex = p.x - x, ey = p.y - y, d2 = ex * ex + ey * ey;
    if (d2 < R2) {
      const d = Math.sqrt(d2) || 1, f = (1 - d / R) * 2.5 + .5;
      p.fly = true; p.vx = ex / d * f + dx * .15; p.vy = ey / d * f * .5 + dy * .1; cleared++;
    }
  }
  if (cleared > parts.length * .3) blow();
}

/* puflash: nafas nuqtasi yaqinidagi zarrachalar sochiladi, qolgani qum kabi to'kiladi */
function blow(ox = W / 2, oy = H * .85) {
  if (state !== 'idle') return;
  state = 'blown'; blowT = performance.now();
  gWrap.classList.add('blowing');
  gWrap.style.pointerEvents = 'none';
  for (const p of parts) {
    if (p.fly) continue;
    const ex = p.x - ox, ey = p.y - oy, d = Math.hypot(ex, ey) || 1;
    const push = Math.max(0, 1 - d / (H * .45)) * 6;
    p.fly = true;
    p.vx = ex / d * push + (Math.random() - .5) * 1.1;
    p.vy = ey / d * push * .6 + Math.random() * 1.2;
  }
  stopMic();
  playMusic();
  setTimeout(openCurtain, reduced ? 200 : 1350);
  setTimeout(() => document.body.classList.remove('locked'), 4200);
}

function finishGlitter() {
  cancelAnimationFrame(raf);
  gWrap.remove();
}

/* pointer: bosish = ochish, surish = yaltiroqni tozalash */
let down = null, last = null;
gWrap.addEventListener('pointerdown', e => {
  down = {x: e.clientX, y: e.clientY, t: performance.now()}; last = down;
  resumeMic();
});
gWrap.addEventListener('pointermove', e => {
  if (!down || state !== 'idle') return;
  wipe(e.clientX, e.clientY, e.clientX - last.x, e.clientY - last.y);
  last = {x: e.clientX, y: e.clientY};
});
gWrap.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 12 && performance.now() - down.t < 600) blow(e.clientX, e.clientY);
  down = null;
});
gWrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blow(); } });

/* ---------- mikrofon: puflashni aniqlash ---------- */
let ac, analyser, stream, micBuf, hot = 0;
async function startMic() {
  if (!navigator.mediaDevices?.getUserMedia) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    if (state !== 'idle') { stopMic(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 512;
    src.connect(analyser);
    micBuf = new Uint8Array(analyser.frequencyBinCount);
    $('#micHint').classList.add('on');
    listen();
  } catch (_) { /* ruxsat berilmadi — bosish ishlaydi */ }
}
function resumeMic() { if (ac && ac.state === 'suspended') ac.resume(); }
function listen() {
  if (!analyser || state !== 'idle') return;
  analyser.getByteFrequencyData(micBuf);
  let low = 0; for (let i = 1; i < 24; i++) low += micBuf[i];
  low /= 23;
  hot = low > 150 ? hot + 1 : Math.max(0, hot - 1);
  if (hot > 5) { blow(); return; }
  requestAnimationFrame(listen);
}
function stopMic() {
  stream?.getTracks().forEach(t => t.stop());
  ac?.close?.().catch(() => {});
  analyser = null;
}

/* =====================================================================
   2. PARDA — baxmal mato canvas'da chiziladi va tabiiy ochiladi:
      tepasi oldin, pasti kechikib, to'lqinlanib; burmalar yon tomonda yig'iladi
   ===================================================================== */
const hero = $('#hero'), cCv = $('#curtainCv'), cx = cCv.getContext('2d');
const CUR = {start: null, dur: 3.1, lag: .9, texL: null, texR: null, shL: null, shR: null, D: 1, visible: true};

function mix(a, b, k) { return a.map((v, i) => Math.round(v + (b[i] - v) * k)); }
function buildCurtain() {
  const D = CUR.D = Math.min(devicePixelRatio || 1, 2);
  const w = hero.clientWidth, h = hero.clientHeight;
  cCv.width = Math.round(w * D); cCv.height = Math.round(h * D);
  const TW = Math.ceil(cCv.width / 2) + 2, TH = cCv.height;
  const t = document.createElement('canvas'); t.width = TW; t.height = TH;
  const x = t.getContext('2d');
  const DARK = [26, 0, 5], MID = [118, 3, 20], HI = [196, 18, 42], SHEEN = [250, 80, 100];
  const fold = 40 * D;
  for (let i = 0; i < TW; i++) {
    const ph = i / fold * 6.283 + Math.sin(i / (fold * 2.9)) * 1.3 + Math.sin(i / (fold * .77)) * .25;
    let s = .5 + .5 * Math.cos(ph);
    s = Math.pow(s, 1.7) * .85 + .15 * (.5 + .5 * Math.cos(ph * 2.2 + 1));
    s *= .35 + .65 * Math.min(1, (TW - i) / (16 * D));   // ichki chet — soya
    s *= .55 + .45 * Math.min(1, i / (12 * D));
    const c = s < .5 ? mix(DARK, MID, s * 2) : s < .9 ? mix(MID, HI, (s - .5) / .4) : mix(HI, SHEEN, (s - .9) / .1);
    x.fillStyle = `rgb(${c})`; x.fillRect(i, 0, 1, TH);
  }
  // baxmal tukchalari
  for (let k = 0; k < TW * TH / 90; k++) {
    x.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.18)' : 'rgba(255,120,130,.07)';
    x.fillRect(Math.random() * TW, Math.random() * TH, D, D * (1 + Math.random() * 3));
  }
  // vertikal yorug'lik/soya
  let gr = x.createLinearGradient(0, 0, 0, TH);
  gr.addColorStop(0, 'rgba(0,0,0,.72)'); gr.addColorStop(.18, 'rgba(0,0,0,.12)');
  gr.addColorStop(.45, 'rgba(0,0,0,0)'); gr.addColorStop(.82, 'rgba(0,0,0,.25)'); gr.addColorStop(1, 'rgba(0,0,0,.7)');
  x.fillStyle = gr; x.fillRect(0, 0, TW, TH);
  x.globalCompositeOperation = 'lighter';
  gr = x.createRadialGradient(TW * .85, TH * .4, 0, TW * .85, TH * .4, TW * .9);
  gr.addColorStop(0, 'rgba(120,10,25,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, TW, TH);
  x.globalCompositeOperation = 'source-over';
  CUR.texL = t;
  // o'ng parda — ko'zgu
  const r = document.createElement('canvas'); r.width = TW; r.height = TH;
  const rx = r.getContext('2d'); rx.translate(TW, 0); rx.scale(-1, 1); rx.drawImage(t, 0, 0);
  CUR.texR = r;
  // parda tushiradigan soya
  const mk = flip => {
    const s = document.createElement('canvas'); s.width = Math.round(34 * D); s.height = 1;
    const sx = s.getContext('2d'), sg = sx.createLinearGradient(flip ? s.width : 0, 0, flip ? 0 : s.width, 0);
    sg.addColorStop(0, 'rgba(0,0,0,.65)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    sx.fillStyle = sg; sx.fillRect(0, 0, s.width, 1); return s;
  };
  CUR.shL = mk(false); CUR.shR = mk(true);
  drawCurtain(performance.now());
}

const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function openAt(sec, yr, delay) {
  if (CUR.start == null) return 0;
  if (reduced) return 1;
  const k = (sec - delay - yr * CUR.lag) / CUR.dur;
  return ease(Math.max(0, Math.min(1, k)));
}

function drawCurtain(now) {
  const Wd = cCv.width, Hd = cCv.height, half = Wd / 2, D = CUR.D, TW = CUR.texL.width;
  const sec = CUR.start == null ? 0 : (now - CUR.start) / 1000;
  const step = Math.max(2, Math.round(3 * D)), SW = CUR.shL.width;
  const OPEN = .84, overlap = 3 * D;
  cx.clearRect(0, 0, Wd, Hd);
  for (let y = 0; y < Hd; y += step) {
    const yr = y / Hd;
    const pl = openAt(sec, yr, 0), pr = openAt(sec, yr, .18);
    // ochilish paytidagi to'lqin + ochilgandan keyingi yengil tebranish
    const wl = Math.sin(yr * 3.6 - sec * 2.4) * pl * (1 - pl) * 4 * 18 * D + Math.sin(sec * .9 + yr * 2.2) * 2.2 * D * yr * pl;
    const wr = Math.sin(yr * 3.2 - sec * 2.1 + 1) * pr * (1 - pr) * 4 * 18 * D + Math.sin(sec * .8 + yr * 2.5 + 2) * 2.2 * D * yr * pr;
    const eL = half + overlap - (half * OPEN) * pl + wl;
    const eR = half - overlap + (half * OPEN) * pr + wr;
    const h = Math.min(step, Hd - y);
    if (pl > 0) cx.drawImage(CUR.shL, 0, 0, SW, 1, eL - 2, y, SW, h);
    if (pr > 0) cx.drawImage(CUR.shR, 0, 0, SW, 1, eR - SW + 2, y, SW, h);
    cx.drawImage(CUR.texL, 0, y, TW, h, 0, y, eL, h);
    cx.drawImage(CUR.texR, 0, y, TW, h, eR, y, Wd - eR, h);
  }
}

function curtainLoop(now) {
  requestAnimationFrame(curtainLoop);
  if (!CUR.visible) return;
  drawCurtain(now);
}

function openCurtain() {
  CUR.start = performance.now();
  hero.classList.add('open');
  startDust();
  requestAnimationFrame(curtainLoop);
}
new IntersectionObserver(([e]) => { CUR.visible = e.isIntersecting; }).observe(hero);

/* sahnadagi uchqunlar (nur ichida suzib tushadi) */
function startDust() {
  const cv = $('#dust'), x = cv.getContext('2d');
  let w, h, dots, visible = true;
  const size = () => {
    const d = Math.min(devicePixelRatio || 1, 2);
    w = hero.clientWidth; h = hero.clientHeight;
    cv.width = w * d; cv.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);
    dots = Array.from({length: Math.round(w * h / 3000)}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + .2,
      vy: .12 + Math.random() * .45, vx: (Math.random() - .5) * .15, ph: Math.random() * 6.28
    }));
  };
  size(); addEventListener('resize', size);
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(hero);
  const fade = performance.now();
  (function frame(t) {
    requestAnimationFrame(frame);
    if (!visible || reduced) return;
    x.clearRect(0, 0, w, h);
    const k = Math.min(1, (t - fade) / 2500);
    for (const d of dots) {
      d.y += d.vy; d.x += d.vx + Math.sin(t * .0005 + d.ph) * .12;
      if (d.y > h + 4) { d.y = -4; d.x = Math.random() * w; }
      const tw = .35 + .65 * Math.abs(Math.sin(d.ph + t * .0015));
      x.globalAlpha = tw * k * .9;
      x.fillStyle = d.r > 1.1 ? '#fff' : '#ffd6d0';
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.283); x.fill();
    }
  })(fade);
}

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold: .18});
document.querySelectorAll('.fx').forEach(el => io.observe(el));

/* teskari sanoq */
const target = new Date(C.date).getTime();
const pad = n => String(n).padStart(2, '0');
function tick() {
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  $('#d').textContent = Math.floor(s / 86400); s %= 86400;
  $('#h').textContent = pad(Math.floor(s / 3600)); s %= 3600;
  $('#m').textContent = pad(Math.floor(s / 60));
  $('#s').textContent = pad(s % 60);
}
tick(); setInterval(tick, 1000);

/* kalendarga qo'shish (.ics) */
$('#calBtn').addEventListener('click', () => {
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const start = new Date(target), end = new Date(target + C.durationHours * 3600e3);
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//taklifnoma//UZ','BEGIN:VEVENT',
    `UID:${f(start)}-wedding@taklifnoma`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(start)}`,`DTEND:${f(end)}`,
    `SUMMARY:${C.groom} & ${C.bride} — to'y`,`LOCATION:${C.venue}\\, ${C.address}\\, ${C.city}`,
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Ertaga to\'y!','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type: 'text/calendar'}));
  a.download = `${C.groom}-${C.bride}-toy.ics`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* RSVP */
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const fd = new FormData(e.target), name = fd.get('name').trim();
  if (!name) { e.target.name.focus(); e.target.name.style.borderColor = '#ff4d5e'; return; }
  const yes = fd.get('go') === 'yes';
  const msg = `Assalomu alaykum! ${name}.\n${yes ? `To'yga albatta kelaman (${fd.get('count')} kishi).` : `Afsuski, to'yga kela olmayman.`}` +
              (fd.get('msg').trim() ? `\nTilak: ${fd.get('msg').trim()}` : '');
  if (C.rsvpWhatsApp) open(`https://wa.me/${C.rsvpWhatsApp}?text=${encodeURIComponent(msg)}`, '_blank');
  else if (C.rsvpTelegram) { navigator.clipboard?.writeText(msg).catch(() => {}); open(`https://t.me/${C.rsvpTelegram}`, '_blank'); }
  try { localStorage.setItem('rsvp', JSON.stringify({name, yes})); } catch (_) {}
  e.target.style.display = 'none';
  $('#thanksText').textContent = yes ? `${name}, sizni intiqlik bilan kutamiz!` : `${name}, javobingiz uchun rahmat. Sizni sog'inamiz.`;
  $('#thanks').classList.add('show');
});

/* musiqa */
const audio = $('#audio'), mBtn = $('#music');
function playMusic() {
  if (!C.music) return;
  if (!audio.src) audio.src = C.music;
  mBtn.classList.add('show');
  audio.play().then(() => mBtn.classList.add('playing')).catch(() => {});
}
mBtn.addEventListener('click', () => {
  if (audio.paused) { audio.play(); mBtn.classList.add('playing'); }
  else { audio.pause(); mBtn.classList.remove('playing'); }
});

sizeGlitter();

raf = requestAnimationFrame(loop);

})();
