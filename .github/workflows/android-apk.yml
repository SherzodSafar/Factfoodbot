# Chipta Radar Android ilovasini yig'ish: APK chipta-radar/public/app/ ga yoziladi
# (server uni /download/chipta-radar.apk manzilida beradi).
name: Android APK

on:
  push:
    branches: [ccr-b950cfe7-8tk6gp]
    paths:
      - 'chipta-radar/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Tabiiy o'zbekcha ovozli xabar (Microsoft Edge neyron ovozi «Madina»). Repoda o'z yozuvingiz
      # (res/raw/voice.mp3) bo'lsa — o'sha ishlatiladi. Bo'lmasa va yaratib bo'lmasa — telefon ovozi.
      - name: Ovozli xabar
        continue-on-error: true
        run: |
          RAW=chipta-radar/android/app/src/main/res/raw
          mkdir -p "$RAW"
          if [ ! -s "$RAW/voice.mp3" ]; then
            rm -f "$RAW/voice.mp3"
            TEXT="Assalomu alaykum! Chipta topuvchi botda siz soʻragan chipta paydo boʻldi. Tezroq kirib, sotib oling!"
            # 1) Microsoft Edge neyron ovozi (Madina)
            pip install --quiet --upgrade edge-tts \
              && edge-tts --voice uz-UZ-MadinaNeural --rate=-5% --text "$TEXT" --write-media /tmp/voice.mp3 \
              && [ -s /tmp/voice.mp3 ] && cp /tmp/voice.mp3 "$RAW/voice.mp3" && echo "Ovoz: Edge (Madina)"
          fi
          if [ ! -s "$RAW/voice.mp3" ]; then
            # 2) Zaxira: Meta MMS-TTS o'zbekcha (lotin) ochiq modeli
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet transformers scipy
            python - <<'PY'
          import torch, scipy.io.wavfile
          from transformers import VitsModel, AutoTokenizer
          name = "facebook/mms-tts-uzb-script_latin"
          model, tok = VitsModel.from_pretrained(name), AutoTokenizer.from_pretrained(name)
          torch.manual_seed(7)
          parts = ["assalomu alaykum!", "chipta topuvchi botda siz so'ragan chipta paydo bo'ldi.", "tezroq kirib, sotib oling!"]
          waves = []
          with torch.no_grad():
              for text in parts:
                  waves.append(model(**tok(text, return_tensors="pt")).waveform[0])
                  waves.append(torch.zeros(int(model.config.sampling_rate * 0.35)))
          scipy.io.wavfile.write("/tmp/voice.wav", model.config.sampling_rate, torch.cat(waves).numpy())
          PY
            ffmpeg -loglevel error -y -i /tmp/voice.wav -codec:a libmp3lame -qscale:a 3 "$RAW/voice.mp3" && echo "Ovoz: Meta MMS"
          fi
          ls -la "$RAW"

      - name: APK yig'ish
        run: gradle -p chipta-radar/android assembleRelease --no-daemon --stacktrace

      - name: APK ni branchga yozish
        run: |
          mkdir -p chipta-radar/public/app
          cp chipta-radar/android/app/build/outputs/apk/release/app-release.apk chipta-radar/public/app/chipta-radar.apk
          cp chipta-radar/android/app/src/main/res/raw/voice.mp3 chipta-radar/public/app/voice.mp3 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chipta-radar/public/app/
          git commit -m "Android APK yig'ildi [skip ci]" || echo "O'zgarish yo'q"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: chipta-radar-apk
          path: chipta-radar/public/app/chipta-radar.apk
