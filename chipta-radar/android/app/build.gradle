plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.chiptaradar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.chiptaradar.app'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    // Ilova Play Market'ga emas, to'g'ridan-to'g'ri o'rnatiladi — doimiy imzo (yangilanish ustidan o'rnatiladi)
    signingConfigs {
        release {
            storeFile file('../keystore/chipta-radar.jks')
            storePassword 'chiptaradar'
            keyAlias 'chiptaradar'
            keyPassword 'chiptaradar'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
